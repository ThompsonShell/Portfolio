<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>404 — Page Not Found</title>
<style>
  html, body {
    height: 100%;
    margin: 0;
    background: #000000;
    color: #e5e5e5;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  }
  .wrap {
    min-height: 100%;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 24px;
  }
  h1 {
    font-size: 6rem;
    font-weight: 700;
    color: #F59E0B;
    margin: 0 0 1rem;
  }
  h2 {
    font-size: 1.5rem;
    font-weight: 600;
    color: #e5e5e5;
    margin: 0 0 1rem;
  }
  p {
    color: #8c8c94;
    max-width: 28rem;
    margin: 0 0 2rem;
  }
  a.btn {
    display: inline-block;
    padding: 0.75rem 1.5rem;
    background: #F59E0B;
    color: #ffffff;
    text-decoration: none;
    border-radius: 0.5rem;
    font-weight: 500;
    transition: background-color 0.2s ease;
  }
  a.btn:hover {
    background: #F97316;
  }
</style>
</head>
<body>
  <div class="wrap">
    <h1>404</h1>
    <h2>Page Not Found</h2>
    <p>Looks like you&apos;ve wandered into uncharted territory. The page you&apos;re looking for doesn&apos;t exist or has been moved.</p>
    <a class="btn" href="/">Go Back Home</a>
  </div>
</body>
</html>
