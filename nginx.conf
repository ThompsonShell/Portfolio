upstream backend {
    server 127.0.0.1:8000;
}

server {
    listen 80;
    server_name your-domain.com;  # ← CHANGE THIS

    # ---------- Logging ----------
    access_log /var/log/nginx/thompsonshell-access.log;
    error_log  /var/log/nginx/thompsonshell-error.log;

    # ---------- Backend API proxy ----------
    location /api/ {
        proxy_pass http://backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ---------- Django Admin ----------
    location /admin/ {
        proxy_pass http://backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ---------- Django Static files ----------
    location /static/ {
        alias /home/acer/Desktop/ThompsonShell/portfolio-backend/staticfiles/;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # ---------- Django Media files ----------
    location /media/ {
        alias /home/acer/Desktop/ThompsonShell/portfolio-backend/media/;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # ---------- Frontend (Next.js) ----------
    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
