# ============================================================================
#  ThompsonShell — nginx reverse proxy
#  /api, /admin, /static, /media  -> Django (gunicorn @ 127.0.0.1:8000)
#  everything else                -> Next.js (@ 127.0.0.1:3000)
#
#  Put this in /etc/nginx/sites-available/portfolio.conf and symlink it into
#  sites-enabled/, or drop it in /etc/nginx/conf.d/. Then: nginx -t && systemctl reload nginx
# ============================================================================

# Larger hash bucket helps with the longer proxy header names tus uses.
# server_names_hash_bucket_size 128;   # uncomment if nginx complains

server {
    listen 80;
    server_name asilbek.me www.asilbek.me;   # <-- your domain(s)

    # With chunked upload nginx only ever sees ONE 10 MB chunk per request, not
    # the whole 5 GB file — so this does not need to be 6 GB. Keep headroom for a
    # chunk + tus headers. (Only raise to multi-GB if you ever do non-chunked PUTs.)
    client_max_body_size 100m;

    # Long timeouts: a single chunk over a slow Singapore link, or tusd holding a
    # connection, must not be cut off mid-transfer.
    client_body_timeout   3600s;
    send_timeout          3600s;
    keepalive_timeout     75s;

    # ---- Django API (includes the tus upload endpoints under /api/upload/) ----
    location /api/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # CRITICAL for tus/streamed uploads: stream the body straight to Django
        # instead of buffering the whole chunk to a temp file first.
        proxy_request_buffering off;
        proxy_buffering         off;

        proxy_connect_timeout 60s;
        proxy_send_timeout    3600s;
        proxy_read_timeout    3600s;
    }

    # ---- Django admin ----
    location /admin/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ---- Django static ----
    location /static/ {
        alias /home/acer/Desktop/ThompsonShell/portfolio-backend/staticfiles/;   # <-- server path
        access_log off;
        expires 30d;
    }

    # ---- Uploaded media (serve the big video files directly, not through Django) ----
    location /media/ {
        alias /home/acer/Desktop/ThompsonShell/portfolio-backend/media/;         # <-- server path
        # Efficient large-file delivery:
        sendfile on;
        tcp_nopush on;
        aio threads;
        # Range requests let the <video> player seek without downloading everything.
        add_header Accept-Ranges bytes;
        access_log off;
    }

    # ---- Next.js (all remaining routes: /, /lectures, /admin/upload, ...) ----
    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        "upgrade";
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # ========================================================================
    #  OPTION A (tusd) — uncomment if you run the tusd container instead of the
    #  built-in Django tus server. tusd listens on 127.0.0.1:1080 and owns the
    #  whole upload; Django only receives the webhook (which stays under /api/).
    # ========================================================================
    # location /files/ {
    #     proxy_pass http://127.0.0.1:1080;
    #     proxy_http_version 1.1;
    #     proxy_request_buffering off;
    #     proxy_buffering         off;
    #     proxy_set_header Host              $host;
    #     proxy_set_header X-Forwarded-Proto $scheme;
    #     proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    #     # tusd sets these; make sure nginx forwards them back to the browser.
    #     proxy_pass_header Upload-Offset;
    #     proxy_pass_header Location;
    #     proxy_pass_header Tus-Resumable;
    #     proxy_read_timeout 3600s;
    #     proxy_send_timeout 3600s;
    #     client_max_body_size 0;   # tusd enforces its own -max-size
    # }
}
